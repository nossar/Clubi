[project]
name = "clubi-backend"
version = "0.1.0"
description = "Backend do Clubi — clube do livro da ESPM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.8",
    "django-ninja>=1.6.2",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.0.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-decouple>=3.8",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.9",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "clubi.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint.per-file-ignores]
"*/models.py" = ["RUF012"]
"*/admin.py" = ["RUF012"]
