{% extends "registration/base.html" %}

{% block title %}Alterar senha · Clubi{% endblock %}
{% block heading %}Alterar senha{% endblock %}

{% block content %}
  <p class="auth-lead">Confirme a senha atual e escolha uma nova.</p>

  <form class="auth-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Salvar</button>
  </form>

  <p class="auth-links">
    <a href="/">Voltar para o Clubi</a>
  </p>
{% endblock %}
